<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Task Tracker</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif; background: #ffffff; color: #0f172a; }
    .card { max-width: 320px; padding: 24px; text-align: center; }
    .logo { width: 48px; height: 48px; border-radius: 12px; background: #4f46e5; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #64748b; margin: 0 0 24px; }
    button { width: 100%; height: 44px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0b0f19; color: #f1f5f9; } p { color: #94a3b8; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4 4L19 7"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Task Tracker couldn't reach the server. Check your internet connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    var target = new URLSearchParams(location.search).get('retry');
    document.getElementById('retry').addEventListener('click', function () {
      if (target && /^https:\/\//.test(target)) location.href = target;
      else location.href = 'index.html';
    });
  </script>
</body>
</html>
